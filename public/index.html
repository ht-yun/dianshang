<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="电商智能库存补货系统：多平台库存同步、价格采集对比、AI 智能补货建议、供应商采购单自动生成与可视化数据看板。">
  <meta name="theme-color" content="#F3F8EF">
  <title>智能库存补货系统 · 全渠道库存中台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232F9E62'/><path d='M28 62 L44 42 L58 56 L72 34' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/css/app.css?v=5">
  <!-- defer：与 HTML 解析并行下载，不再阻塞首屏；按文档顺序执行，仍早于 app.js -->
  <script src="/vendor/echarts.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- 侧边导航 -->
    <aside class="sidebar" id="sidebar">
      <!-- 角落枝叶装饰：浅绿主题的植物元素 -->
      <div class="sidebar-leaf" aria-hidden="true">
        <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 154C36 124 58 92 76 46" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
          <path d="M72 66c-14-2-24-12-27-26 14-2 25 6 29 18z" fill="currentColor" opacity=".6"/>
          <path d="M80 46c11-9 25-10 35-3-4 12-16 18-28 16z" fill="currentColor" opacity=".5"/>
          <path d="M58 96c-15 0-27-7-32-20 14-4 26 2 32 12z" fill="currentColor" opacity=".55"/>
          <path d="M64 86c10-9 23-12 34-7-3 12-14 19-26 18z" fill="currentColor" opacity=".45"/>
          <path d="M40 124c-14 3-26-1-33-12 11-7 24-4 32 5z" fill="currentColor" opacity=".5"/>
        </svg>
      </div>
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17l5-6 4 4 6-8"/><path d="M3 21h18"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>库存中台</strong>
          <span>Smart Replenish</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/dashboard" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>数据看板</span>
        </a>
        <a class="nav-item" href="#/inventory" data-view="inventory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V6a2 2 0 00-1-1.7l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 6v12a2 2 0 001 1.7l7 4a2 2 0 002 0l7-4A2 2 0 0021 18V8z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>
          <span>商品库存</span>
        </a>
        <a class="nav-item" href="#/pricing" data-view="pricing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L13.4 20.6a2 2 0 01-2.8 0l-7.2-7.2A2 2 0 013 12V5a2 2 0 012-2h7a2 2 0 011.4.6l7.2 7.2a2 2 0 010 2.6z"/><circle cx="8" cy="8" r="1.4"/></svg>
          <span>价格监控</span>
        </a>
        <a class="nav-item" href="#/replenish" data-view="replenish">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M12 7v5l3.5 2"/><path d="M12 2v2M12 20v2"/></svg>
          <span>智能补货</span>
          <em class="nav-badge" id="badge-replenish" hidden>0</em>
        </a>
        <a class="nav-item" href="#/orders" data-view="orders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l1 3h3a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h3l1-3z"/><path d="M8 12h8M8 16h5"/></svg>
          <span>供应商订单</span>
        </a>
        <a class="nav-item" href="#/alerts" data-view="alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9a2 2 0 013.4 0l7 12A2 2 0 0119 19H5a2 2 0 01-1.7-3.1l7-12z"/><path d="M12 9v4M12 16.5v.5"/></svg>
          <span>预警中心</span>
          <em class="nav-badge danger" id="badge-alerts" hidden>0</em>
        </a>
        <a class="nav-item" href="#/datasource" data-view="datasource">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/><path d="M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
          <span>数据源接入</span>
        </a>
        <a class="nav-item" href="#/settings" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 003.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H8a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V8a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
          <span>算法设置</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="live-dot" id="conn-state">
          <i></i><span>实时通道连接中…</span>
        </div>
      </div>
    </aside>

    <!-- 主区域 -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="切换菜单">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="page-title">
            <h1 id="page-title">数据看板</h1>
            <p id="page-sub">全渠道库存与补货态势总览</p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="sync-chip" title="最近一次同步时间">
            <span class="pulse"></span>
            <span id="last-sync">实时同步中</span>
          </div>
          <button class="btn btn-ghost" id="btn-simulate" title="模拟一笔平台订单，观察库存实时变化">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
            模拟订单
          </button>
          <button class="btn btn-ghost" id="btn-sync" title="拉取各平台最新库存">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3.5-7.1"/><path d="M21 3v6h-6"/></svg>
            立即同步
          </button>
        </div>
      </header>

      <main class="content" id="view">
        <!-- 首屏骨架：纯静态，JS 尚未执行时也能看到结构，避免白屏 -->
        <div class="boot-skeleton">
          <div class="bs-hero"></div>
          <div class="bs-row">
            <div class="bs-card"></div><div class="bs-card"></div>
            <div class="bs-card"></div><div class="bs-card"></div>
          </div>
          <div class="bs-row bs-row-wide">
            <div class="bs-card bs-tall"></div><div class="bs-card bs-tall"></div>
          </div>
          <div class="bs-text">正在加载系统…</div>
        </div>
      </main>
    </div>
  </div>

  <!-- 抽屉 -->
  <div class="drawer-mask" id="drawer-mask" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <header class="drawer-head">
      <h2 id="drawer-title">详情</h2>
      <button class="icon-btn" id="drawer-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <!-- 模态框 -->
  <div class="modal-mask" id="modal-mask" hidden>
    <div class="modal" id="modal">
      <header class="modal-head">
        <h2 id="modal-title">提示</h2>
        <button class="icon-btn" id="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot" id="modal-foot"></footer>
    </div>
  </div>

  <!-- 实时事件提示 -->
  <div class="toast-stack" id="toasts"></div>

  <script type="module" src="/js/app.js?v=5"></script>
</body>
</html>
